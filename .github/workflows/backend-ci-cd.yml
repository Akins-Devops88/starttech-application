name: Backend CI-CD

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'k8s/deployment.yaml'
      - '.github/workflows/backend-ci-cd.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'k8s/deployment.yaml'
      - '.github/workflows/backend-ci-cd.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: backend-deployment
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2
  ECR_REPOSITORY: starttech-backend-api
  CODEBUILD_PROJECT: starttech-backend-eks-deploy

jobs:
  test-and-deploy:
    name: Test and deploy backend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Download Go dependencies
        working-directory: backend
        run: go mod download

      - name: Run Go tests
        working-directory: backend
        run: go test -v ./...

      - name: Build Go application
        working-directory: backend
        run: go build -v ./...

      - name: Configure AWS credentials using GitHub OIDC
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::938917088089:role/starttech-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "Image tag $IMAGE_TAG already exists. Reusing immutable image."
          else
            echo "Building and pushing image $IMAGE_TAG."

            docker build \
              -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
              ./backend

            docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          fi

      - name: Trigger private CodeBuild EKS deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "===== STARTING PRIVATE CODEBUILD DEPLOYMENT ====="

          BUILD_ID=$(aws codebuild start-build \
            --project-name "$CODEBUILD_PROJECT" \
            --environment-variables-override \
              "name=IMAGE_TAG,value=$IMAGE_TAG,type=PLAINTEXT" \
            --region "$AWS_REGION" \
            --query 'build.id' \
            --output text)

          if [ -z "$BUILD_ID" ] || [ "$BUILD_ID" = "None" ]; then
            echo "ERROR: CodeBuild did not return a build ID."
            exit 1
          fi

          echo "CodeBuild build started: $BUILD_ID"

          echo "===== MONITORING CODEBUILD DEPLOYMENT ====="

          for attempt in $(seq 1 80); do
            STATUS=$(aws codebuild batch-get-builds \
              --ids "$BUILD_ID" \
              --region "$AWS_REGION" \
              --query 'builds[0].buildStatus' \
              --output text)

            echo "CodeBuild status: $STATUS"

            case "$STATUS" in
              SUCCEEDED)
                echo "===== BACKEND DEPLOYMENT SUCCEEDED ====="
                exit 0
                ;;
              FAILED|FAULT|STOPPED|TIMED_OUT)
                echo "ERROR: CodeBuild deployment ended with status: $STATUS"
                exit 1
                ;;
              IN_PROGRESS|None)
                sleep 15
                ;;
              *)
                echo "ERROR: Unexpected CodeBuild status: $STATUS"
                exit 1
                ;;
            esac
          done

          echo "ERROR: Timed out waiting for CodeBuild deployment."
          exit 1
