name: Backend CI-CD

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'k8s/deployment.yaml'
      - '.github/workflows/backend-ci-cd.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'k8s/deployment.yaml'
      - '.github/workflows/backend-ci-cd.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: backend-deployment
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2
  ECR_REPOSITORY: starttech-backend-api
  EKS_CLUSTER: starttech-assessment-eks
  K8S_NAMESPACE: muchtodo
  K8S_DEPLOYMENT: starttech-backend
  K8S_CONTAINER: backend

jobs:
  test-and-deploy:
    name: Test and deploy backend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Download Go dependencies
        working-directory: backend
        run: go mod download

      - name: Run Go tests
        working-directory: backend
        run: go test -v ./...

      - name: Build Go application
        working-directory: backend
        run: go build -v ./...

      - name: Configure AWS credentials using GitHub OIDC
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::938917088089:role/starttech-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            ./backend

          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Install kubectl
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.34.13'

      - name: Configure kubectl for EKS
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER"

      - name: Deploy backend to EKS
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          kubectl set image \
            deployment/"$K8S_DEPLOYMENT" \
            "$K8S_CONTAINER=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -n "$K8S_NAMESPACE"

          kubectl rollout status \
            deployment/"$K8S_DEPLOYMENT" \
            -n "$K8S_NAMESPACE" \
            --timeout=5m

          kubectl get deployment "$K8S_DEPLOYMENT" \
            -n "$K8S_NAMESPACE"
