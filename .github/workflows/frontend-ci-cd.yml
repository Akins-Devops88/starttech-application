name: Frontend CI-CD

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci-cd.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci-cd.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: frontend-deployment
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2
  S3_BUCKET: starttech-frontend-bucket-938917088089-eu-west-2
  CLOUDFRONT_DISTRIBUTION_ID: E2975DW0YE6P1B

jobs:
  build-and-deploy:
    name: Build and deploy frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Configure AWS credentials using GitHub OIDC
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::938917088089:role/starttech-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload frontend to private S3 bucket
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          aws s3 sync frontend/dist/ "s3://$S3_BUCKET/" --delete

      - name: Invalidate CloudFront cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"
